name: Sync player roster from OneDrive

on:
  # Poll OneDrive on a schedule so spreadsheet edits reach the site on their own.
  # Minute 17 rather than 0: GitHub heavily contends scheduled runs on the hour and
  # delays them, so an off-peak minute actually fires closer to on time.
  schedule:
    - cron: "17 */3 * * *"
  # Still runnable on demand — use this when you want an edit live immediately
  # (e.g. right before the draft) instead of waiting for the next scheduled run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Download the file from OneDrive
        env:
          BCIV_TRACKER: ${{ secrets.BCIV_TRACKER }}
        run: python scripts/fetch_onedrive_file.py

      - name: Commit updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/BCIV_Draft.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync BCIV_Draft.xlsx from OneDrive"
            git push
          fi
